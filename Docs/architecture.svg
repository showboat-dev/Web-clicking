<text x="1325" y="1464" font-size="11.5" fill="#334155">· 自动重编译 IR（可回滚）+ 回归</text>
<text x="1325" y="1500" font-size="10.5" fill="#94a3b8">失败则升级下一级</text>
<text x="88" y="1534" font-size="11.5" fill="#334155">每级动作后置验证：URL / 标题 / 关键文本 / 输入值 / DOM 变化 → 未通过升级下一级，禁止静默继续；破坏性操作（提交/支付）暂停等待人工确认（审批闸门，不接管）</text>
<text x="88" y="1552" font-size="11" fill="#64748b">约束：公网任意站点 · 全自动跑完 · 截图不出网 · 可用内网视觉模型 ｜ 详见 Docs/pipeline-robustness.png</text>
