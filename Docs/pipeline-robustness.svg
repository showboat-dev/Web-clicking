<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1428" viewBox="0 0 1760 1428" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
<defs>
