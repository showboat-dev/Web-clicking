<rect x="58" y="704" width="345" height="28" rx="8" fill="#e11d48"/>
<text x="230.5" y="723" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">B 执行兜底阶梯：按成本与可验证性逐级升级</text>
<rect x="70" y="748" width="390" height="244" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="70" y="748" width="6" height="244" rx="3" fill="#059669"/>
<rect x="90" y="764" width="42" height="24" rx="6" fill="#059669"/>
<text x="111" y="781" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">L1</text>
<text x="142" y="781" font-size="14" font-weight="700" fill="#0f172a">语义定位（主路径）</text>
<text x="90" y="808" font-size="11" fill="#64748b">触发：默认第一优先</text>
<text x="90" y="832" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>testId / role+name / label / text</text>
<text x="90" y="852" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>Playwright 自动等待与可见性检查</text>
<text x="90" y="872" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>成本最低、可验证性最高</text>
<text x="90" y="974" font-size="11" fill="#e11d48">风险：改文案、改结构后失配</text>
<line x1="462" y1="844" x2="484" y2="844" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-ink)"/>
<rect x="490" y="748" width="390" height="244" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
<rect x="490" y="748" width="6" height="244" rx="3" fill="#0891b2"/>
<rect x="510" y="764" width="42" height="24" rx="6" fill="#0891b2"/>
<text x="531" y="781" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">L2</text>
<text x="562" y="781" font-size="14" font-weight="700" fill="#0f172a">结构证据恢复</text>
<text x="510" y="808" font-size="11" fill="#64748b">触发：L1 找不到 / 不可交互</text>
<text x="510" y="832" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>frameLocator(frameChain) 进入 iframe</text>
<text x="510" y="852" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>shadow host 链定位开放/封闭 shadow</text>
<text x="510" y="872" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>DOM 快照重推导 + 邻近锚点 + bbox</text>
<text x="510" y="974" font-size="11" fill="#e11d48">风险：页面改版需刷新证据</text>
<line x1="882" y1="844" x2="904" y2="844" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-ink)"/>
<rect x="910" y="748" width="390" height="244" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<rect x="910" y="748" width="6" height="244" rx="3" fill="#d97706"/>
<rect x="930" y="764" width="42" height="24" rx="6" fill="#d97706"/>
<text x="951" y="781" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">L3</text>
<text x="982" y="781" font-size="14" font-weight="700" fill="#0f172a">内网视觉 Agent 兜底</text>
<text x="930" y="808" font-size="11" fill="#64748b">触发：L2 仍失败或元素不可观测</text>
<text x="930" y="832" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>sidecar /ground：截图 + 指令 → 坐标</text>
<text x="930" y="852" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>参考/现场截图 + 置信度阈值 + 预算</text>
<text x="930" y="872" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>坐标动作后走统一验证器</text>
<text x="930" y="974" font-size="11" fill="#e11d48">风险：mock 链路已通；真实 VLM 待接</text>
<line x1="1302" y1="844" x2="1324" y2="844" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-ink)"/>
<rect x="1330" y="748" width="390" height="244" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="1330" y="748" width="6" height="244" rx="3" fill="#7c3aed"/>
<rect x="1350" y="764" width="42" height="24" rx="6" fill="#7c3aed"/>
<text x="1371" y="781" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">L4</text>
<text x="1402" y="781" font-size="14" font-weight="700" fill="#0f172a">失败终止 + 自动重编译</text>
<text x="1350" y="808" font-size="11" fill="#64748b">触发：L3 仍失败 / 验证连续失败</text>
<text x="1350" y="832" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>终止并记录失败现场</text>
<text x="1350" y="852" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>用新证据自动重编译 IR（可回滚）</text>
<text x="1350" y="872" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>失败样本进入回归集 + 告警</text>
<text x="1350" y="974" font-size="11" fill="#e11d48">风险：无人接管，长尾靠迭代收敛</text>
<rect x="70" y="1016" width="1620" height="60" rx="10" fill="#fef2f2" stroke="#fecdd3" stroke-width="1.2"/>
<text x="90" y="1040" font-size="12.5" font-weight="700" fill="#e11d48">验证器（每级必经）</text>
<text x="226" y="1040" font-size="12" fill="#334155">动作后置断言：URL / 标题 / 关键文本 / 输入值 / DOM 变化 / 网络请求 → 未通过则重试或升级下一级，禁止静默继续</text>
<text x="90" y="1062" font-size="11.5" fill="#334155">破坏性操作（提交 / 支付 / 删除）：暂停等待人工确认（审批闸门，不是接管）</text>
<rect x="40" y="1146" width="1680" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="58" y="1158" width="375" height="28" rx="8" fill="#059669"/>
<text x="245.5" y="1177" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">C 反馈闭环与度量：让失败转化为下一次的成功率</text>
<rect x="70" y="1198" width="310" height="96" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.3"/>
<rect x="70" y="1198" width="5" height="96" rx="2.5" fill="#0891b2"/>
