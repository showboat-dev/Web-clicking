<text x="60" y="1388" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">核心结论：</tspan>不要试图让单点更聪明。把失败当作一等公民——录制端存证据、翻译端留退路、执行端做验证、系统端能自愈；AI 只在「语义标注」与「内网视觉兜底」两处出现，且必须被验证与人工审批闸门（仅破坏性操作）约束。</text>
