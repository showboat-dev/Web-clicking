<rect width="1760" height="1428" fill="#f8fafc"/>
<rect x="0" y="0" width="1760" height="140" fill="url(#hdr)"/>
<text x="60" y="60" font-size="30" font-weight="700" fill="#ffffff">录制 → 翻译 → 执行：能力边界 · 分层兜底 · 反馈闭环</text>
<text x="60" y="96" font-size="14" fill="#cbd5e1">讨论结论：三段式方向成立；鲁棒性 = 证据冗余 × 验证资产 × 分层降级 × 自愈沉淀</text>
<text x="1700" y="58" font-size="13" fill="#94a3b8" text-anchor="end">现状：L1/L2 定位恢复 · 动作后置校验 · 执行遥测 · L3 内网视觉待接</text>
<text x="1700" y="86" font-size="13" fill="#94a3b8" text-anchor="end">约束：公网任意站点 · 全自动跑完 · 截图不出网 · 内网视觉模型可用</text>
<rect x="40" y="158" width="1680" height="500" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="58" y="170" width="255" height="28" rx="8" fill="#2563eb"/>
<text x="185.5" y="189" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">A 三段流水线：职责与能力边界</text>
<rect x="70" y="210" width="520" height="424" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<path d="M70 224 a14 14 0 0 1 14 -14 h492 a14 14 0 0 1 14 14 v42 h-520 z" fill="#2563eb"/>
<text x="90" y="240" font-size="17" font-weight="700" fill="#ffffff">① 录制器</text>
<text x="570" y="240" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="end">Observability · 可观测性</text>
<text x="90" y="280" font-size="11" fill="#64748b" font-family="SFMono-Regular, Menlo, monospace">输入：用户真实操作 + 浏览器上下文</text>
<text x="90" y="297" font-size="11" fill="#64748b" font-family="SFMono-Regular, Menlo, monospace">输出：RecordingTrace v2（事件 + 证据）</text>
<text x="90" y="320" font-size="12" font-weight="600" fill="#0f172a">目标</text>
<text x="126" y="320" font-size="12" fill="#334155">尽可能完整地采集操作，让未来执行时有据可依</text>
<text x="90" y="346" font-size="11.5" font-weight="700" fill="#64748b">现状（v2 已实现）</text>
<text x="90" y="370" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>click / dblclick / contextmenu / hover / drag / scroll</text>
<text x="90" y="389" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>input / select / 文件上传 / 富文本 / 按键 / 弹窗 / 下载 / 标签页</text>
<text x="90" y="408" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>五层上下文 + 候选定位器 + 每事件截图 + 证据链</text>
<text x="90" y="434" font-size="11.5" font-weight="700" fill="#e11d48">能力边界 / 风险</text>
<text x="90" y="458" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>原生弹窗：自动接受并记录（受控浏览器限制）</text>
<text x="90" y="477" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>下载：只记事件，回放由点击触发；滚动仅作证据</text>
<text x="90" y="496" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>closed shadow / canvas 不可观测（只能内网视觉兜底）</text>
<text x="90" y="522" font-size="11.5" font-weight="700" fill="#059669">增强方向（v3）</text>
<text x="90" y="546" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>已实现：frameChain / shadowChain / DOM 快照 / viewport 证据</text>
<text x="90" y="565" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>DOM 快照片段 + 可访问名 + bbox/视口 + 前后截图</text>
<text x="90" y="584" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>标注 observability：dom / open-shadow / closed-shadow / visual-only</text>
<text x="90" y="603" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>输出「能力契约」，录制前告知哪些操作将依赖视觉兜底</text>
<text x="90" y="629" font-size="11.5" fill="#2563eb" font-style="italic">原则：录不到的不编造，显式标注不可观测</text>
<rect x="620" y="210" width="520" height="424" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<path d="M620 224 a14 14 0 0 1 14 -14 h492 a14 14 0 0 1 14 14 v42 h-520 z" fill="#d97706"/>
<text x="640" y="240" font-size="17" font-weight="700" fill="#ffffff">② 翻译器</text>
<text x="1120" y="240" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="end">Semantic Compression · 有损压缩</text>
<text x="640" y="280" font-size="11" fill="#64748b" font-family="SFMono-Regular, Menlo, monospace">输入：RecordingTrace v2</text>
<text x="640" y="297" font-size="11" fill="#64748b" font-family="SFMono-Regular, Menlo, monospace">输出：Workflow IR v2（步骤 + 定位计划 + 验证）</text>
<text x="640" y="320" font-size="12" font-weight="600" fill="#0f172a">目标</text>
<text x="676" y="320" font-size="12" fill="#334155">清洗噪声、归一语义、抽象参数，并保留可回退证据</text>
<text x="640" y="346" font-size="11.5" font-weight="700" fill="#64748b">现状（v2 已实现）</text>
<text x="640" y="370" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>规则清洗 + 规则编译：compiler.ts（确定性结构）</text>
<text x="640" y="389" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>AI 只做语义标注：标题 / 参数命名（失败自动回退）</text>
<text x="640" y="415" font-size="11.5" font-weight="700" fill="#e11d48">能力边界 / 风险</text>
<text x="640" y="439" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>规则覆盖不到的模糊噪声仍可能残留</text>
<text x="640" y="458" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>AI 文案质量会波动，但不影响步骤结构与定位器</text>
<text x="640" y="477" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>过度清洗 / 漏步骤由覆盖审计（dropReasons）兜底</text>
<text x="640" y="503" font-size="11.5" font-weight="700" fill="#059669">增强方向（v3）</text>
<text x="640" y="527" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>已实现：Schema 校验 + 覆盖审计 + translatorVersion</text>
<text x="640" y="546" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>已实现：AI 失败回退 rules-only，仍可执行</text>
<text x="640" y="565" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>待做：规则覆盖扩充 + 标注质量评估</text>
<text x="640" y="584" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>保留原始证据，可随时重编译</text>
<text x="640" y="610" font-size="11.5" fill="#d97706" font-style="italic">原则：结构由规则定，AI 只写文案</text>
<rect x="1170" y="210" width="520" height="424" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/>
<path d="M1170 224 a14 14 0 0 1 14 -14 h492 a14 14 0 0 1 14 14 v42 h-520 z" fill="#0891b2"/>
<text x="1190" y="240" font-size="17" font-weight="700" fill="#ffffff">③ 执行器</text>
<text x="1670" y="240" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="end">Reproducibility · 可复现性</text>
<text x="1190" y="280" font-size="11" fill="#64748b" font-family="SFMono-Regular, Menlo, monospace">输入：Workflow IR v2</text>
<text x="1190" y="297" font-size="11" fill="#64748b" font-family="SFMono-Regular, Menlo, monospace">输出：RunRecord + 逐步执行日志（层级/耗时/原因）</text>
<text x="1190" y="320" font-size="12" font-weight="600" fill="#0f172a">目标</text>
<text x="1226" y="320" font-size="12" fill="#334155">确定性复放；失败可定位、可降级、可修复</text>
<text x="1190" y="346" font-size="11.5" font-weight="700" fill="#64748b">现状（v2 已实现）</text>
<text x="1190" y="370" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>7 级候选定位器 + 固定 sleep 等待</text>
<text x="1190" y="389" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>异步运行 + WS 分步进度 + 并发互斥（409）</text>
<text x="1190" y="415" font-size="11.5" font-weight="700" fill="#e11d48">能力边界 / 风险</text>
<text x="1190" y="439" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>iframe / shadow 恢复缺失：frameUrl 录了但只查主 page</text>
<text x="1190" y="458" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>无动作后置验证：不抛异常就算成功</text>
<text x="1190" y="477" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>无重试 / 无取消 / 无总超时；单运行全局互斥</text>
<text x="1190" y="496" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>视觉兜底未落地：录制截图未在执行期使用</text>
<text x="1190" y="522" font-size="11.5" font-weight="700" fill="#059669">增强方向（v3）</text>
<text x="1190" y="546" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>L1 语义 → L2 结构证据 → L3 内网视觉模型 → L4 失败终止 + 重编译</text>
<text x="1190" y="565" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>每步 前置条件 + 后置断言；失败升级而非静默继续</text>
<text x="1190" y="584" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>执行日志/遥测：层级命中率、耗时、失败原因</text>
<text x="1190" y="603" font-size="12" fill="#334155"><tspan fill="#94a3b8">· </tspan>取消与总超时；破坏性操作暂停等待人工确认</text>
<text x="1190" y="629" font-size="11.5" fill="#0891b2" font-style="italic">原则：没有验证的成功 = 未知状态</text>
<line x1="594" y1="420" x2="616" y2="420" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah-blue)"/>
<line x1="1144" y1="420" x2="1166" y2="420" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah-amber)"/>
