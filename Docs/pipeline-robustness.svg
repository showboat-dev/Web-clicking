<text x="88" y="1244" font-size="11.5" fill="#334155">· 每步命中层级 / 耗时</text>
<text x="88" y="1262" font-size="11.5" fill="#334155">· 失败原因 + 现场截图</text>
<line x1="382" y1="1228" x2="404" y2="1228" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-ink)"/>
